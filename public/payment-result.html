<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation status | Teddy Tech Inc</title><link rel="stylesheet" href="style.css"><style>.result-wrap{min-height:100vh;display:grid;place-items:center;padding:25px}.result-card{max-width:580px;width:100%;padding:38px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#111e30,#0b1321);text-align:center}.result-icon{font-size:48px;color:var(--gold)}.result-card h1{line-height:1.2}.result-card p{color:var(--muted);font-size:13px}.result-data{text-align:left;margin:25px 0;padding:17px;border-radius:12px;background:#080f1c;font-size:12px}.result-data div{display:flex;justify-content:space-between;gap:18px;padding:7px 0;border-bottom:1px solid var(--line)}.result-data div:last-child{border:0}.result-data span{color:var(--muted)}.result-data strong{overflow-wrap:anywhere;text-align:right}.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}</style></head><body><div class="result-wrap"><main class="result-card"><a class="brand" href="/"><span class="brand-mark">T</span><span>TEDDY TECH <b>INC</b></span></a><div class="result-icon" id="icon">◌</div><h1 id="heading">Checking your payment…</h1><p id="message">We’re securely checking the transaction with Paystack. Please keep this page open.</p><div class="result-data" id="data" hidden></div><div class="result-actions"><a class="btn primary" href="/">Return Home ↗</a><a class="btn secondary" href="/#donate">Donate Again</a></div></main></div><script>
(async()=>{const params=new URLSearchParams(location.search);let ref=params.get('reference')||params.get('trxref')||sessionStorage.getItem('ttinc_last_reference');const h=document.getElementById('heading'),m=document.getElementById('message'),icon=document.getElementById('icon'),data=document.getElementById('data');if(!ref){h.textContent='Payment status unavailable';m.textContent='We could not find a transaction reference. If you completed checkout, return to the donation page and contact Teddy Tech Inc with your receipt.';icon.textContent='!';return}for(let i=0;i<5;i++){try{const r=await fetch('/api/donations/status/'+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw new Error(d.error||'Verification unavailable');data.hidden=false;data.innerHTML='<div><span>Amount</span><strong>'+d.currency+' '+Number(d.amount).toFixed(2)+'</strong></div><div><span>Reference</span><strong>'+d.reference+'</strong></div><div><span>Status</span><strong>'+d.status.toUpperCase()+'</strong></div><div><span>Date</span><strong>'+new Date(d.paidAt||d.createdAt).toLocaleString()+'</strong></div>';if(d.status==='success'){h.textContent='Thank You for Supporting Teddy Tech Inc!';m.textContent='Your contribution helps maintain our VPS servers, hosting services, and technology projects. We truly appreciate your support.';icon.textContent='✓';return}if(d.status==='failed'){h.textContent='Payment was not completed';m.textContent='Paystack reports that this transaction failed. You can return to the donation form and try again.';icon.textContent='×';return}h.textContent='Payment confirmation pending';m.textContent='Paystack has not confirmed this payment yet. This page checks with the server, but your bank or payment method may need more time.';icon.textContent='◷';}catch(e){h.textContent='We could not verify the payment yet';m.textContent='Please try checking again in a moment. Do not make another payment if you believe your payment already went through.'}if(i<4)await new Promise(r=>setTimeout(r,2500))}})();
</script></body></html>
